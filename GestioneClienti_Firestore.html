<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendario Gestione Clienti</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            }

            .modal-bg {
                background: rgba(0, 0, 0, 0.5);
            }

            /* Centra perfettamente la modale su mobile quando è visibile */
            @media (max-width: 768px) {
                #modal-root:not([style*="display: none"]) {
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                }

                #modal-root:not([style*="display: none"])>div {
                    margin: auto !important;
                    transform: none !important;
                }
            }

            .tab-active {
                border-bottom: 2px solid #3B82F6;
                color: #3B82F6;
                background: #F1F5F9;
            }

            /* --- MIGLIORAMENTI GRAFICI UI/UX --- */

            /* Giorni del calendario */
            [data-datekey] {
                border-radius: 0.5rem;
                transition: background-color 0.3s, transform 0.2s;
            }

            [data-datekey]:hover {
                background-color: #e0f2fe !important;
                transform: scale(1.02);
            }

            [data-datekey]>div:first-child>span {
                font-size: 1rem;
                font-weight: bold;
            }

            [data-datekey] .text-xs.p-2 {
                box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3);
                font-size: 0.75rem;
                font-weight: 500;
            }

            /* Attività e orari */
            [data-datekey] .text-[10px].font-medium {
                background-color: rgba(255, 255, 255, 0.3);
                padding: 0 4px;
                border-radius: 0.25rem;
                display: inline-block;
                margin-top: 2px;
            }

            [data-datekey] .text-[10px].opacity-90 {
                opacity: 0.6;
                font-size: 10px;
            }

            /* Input modale */
            input[type="text"],
            input[type="time"],
            input[type="number"],
            textarea,
            select {
                border-radius: 0.75rem;
                padding: 0.75rem 1rem;
                font-size: 0.875rem;
                transition: box-shadow 0.2s;
            }

            input:focus,
            textarea:focus,
            select:focus {
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            }

            /* Pulsanti */
            button {
                transition: background-color 0.2s, transform 0.1s;
            }

            button:hover {
                transform: translateY(-1px);
            }
        </style>
    </head>

    <body class="bg-gray-50">
        <div id="root" class="max-w-7xl mx-auto p-2 md:p-4"></div>
        <div id="modal-root" style="display:none;"></div>
        <script>
