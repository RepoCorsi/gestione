            // --- Persistenza Ibrida (Firestore + localStorage) ---
            async function saveToStorage() {

            async function loadFromStorage() {
                console.log('Caricamento dati...');

                if (localData) {
                    workSessions = JSON.parse(localData);

                } else {
                    console.log('Nessun dato in localStorage');
                }

                // Se online, prova a sincronizzare da Firestore
                if (isOnline && userId) {
                    console.log('Tentativo di caricamento da Firestore per utente:', userId);
                    try {
                        const doc = await db.collection("work_sessions").doc(userId).get();
                        if (doc.exists) {
                            const cloudData = doc.data().sessions;
                            if (!localData || Object.keys(cloudData).length > Object.keys(workSessions).length) {
                                console.log('Aggiornamento da cloud: dati più recenti disponibili');
                                workSessions = cloudData;
                                localStorage.setItem('workSessions', JSON.stringify(workSessions));
                            }
                        } else {
                            console.log('Nessun dato trovato su Firestore');
                        }
                    } catch (error) {
                        console.error('Errore nel caricamento da Firestore:', error);
                        isOnline = false;
                        updateSyncStatus();
                    }
                } else {

            // --- Utility ---
            function formatDateKey(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
            function isToday(date) {
                const today = new Date();
                return date.getDate() === today.getDate() &&
                    date.getMonth() === today.getMonth() &&
                    date.getFullYear() === today.getFullYear();
            }
            function getDaysInMonth(date) {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startDayOfWeek = (firstDay.getDay() + 6) % 7;
                const days = [];
                // Giorni del mese precedente
                for (let i = startDayOfWeek - 1; i >= 0; i--) {
                    const prevDate = new Date(year, month, -i);
                    days.push({ date: prevDate, isCurrentMonth: false });
                }
                // Giorni del mese corrente
                for (let day = 1; day <= daysInMonth; day++) {
                    const currentDay = new Date(year, month, day);
                    days.push({ date: currentDay, isCurrentMonth: true });
                }
                // Giorni del mese successivo
                const remainingDays = 42 - days.length;
                for (let day = 1; day <= remainingDays; day++) {
                    const nextDate = new Date(year, month + 1, day);
                    days.push({ date: nextDate, isCurrentMonth: false });
                }
                return days;
            }
            function getWeekNumber(date) {
                const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const dayNum = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            }

            // --- Analisi dati ---
            function getAnalyticsData() {
                const allSessions = [];
                Object.entries(workSessions).forEach(([dateKey, sessions]) => {
                    sessions.forEach(session => {
                        allSessions.push({
                            ...session,
                            date: dateKey,
                            dateObj: new Date(dateKey)
                        });
                    });
                });
                // Statistiche generali
                const totalHours = allSessions.reduce((sum, session) => sum + (session.duration || 0), 0);
                const totalRevenue = allSessions.reduce((sum, session) => sum + (session.earnings || 0), 0);
                const uniqueClients = [...new Set(allSessions.map(session => session.clientName))];
                // Dati per cliente
                const clientData = {};
                allSessions.forEach(session => {
                    if (!clientData[session.clientName]) {
                        clientData[session.clientName] = {
                            totalHours: 0,
                            totalRevenue: 0,
                            interventions: 0,
                            color: session.clientColor || '#3B82F6'
                        };
                    }
                    clientData[session.clientName].totalHours += session.duration || 0;
                    clientData[session.clientName].totalRevenue += session.earnings || 0;
                    clientData[session.clientName].interventions += 1;
                });
                // Dati mensili
                const monthlyData = {};
                allSessions.forEach(session => {
                    const monthKey = `${session.dateObj.getFullYear()}-${String(session.dateObj.getMonth() + 1).padStart(2, '0')}`;
                    if (!monthlyData[monthKey]) {
                        monthlyData[monthKey] = { hours: 0, revenue: 0 };
                    }
                    monthlyData[monthKey].hours += session.duration || 0;
                    monthlyData[monthKey].revenue += session.earnings || 0;
                });
                // Dati settimanali
                const weeklyData = {};
                allSessions.forEach(session => {
                    const weekDay = session.dateObj.getDay();
                    const weekDayName = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'][weekDay];
                    if (!weeklyData[weekDayName]) {
                        weeklyData[weekDayName] = { hours: 0, count: 0 };
                    }
                    weeklyData[weekDayName].hours += session.duration || 0;
                    weeklyData[weekDayName].count += 1;
                });
                // Ore per settimana
                const weekData = {};
                allSessions.forEach(session => {
                    const week = getWeekNumber(session.dateObj);
                    const year = session.dateObj.getFullYear();
                    const key = `${year}-W${String(week).padStart(2, '0')}`;
                    if (!weekData[key]) weekData[key] = 0;
                    weekData[key] += session.duration || 0;
                });

                // Dati per produttività temporale
                const hourlyProductivity = {};
                allSessions.forEach(session => {
                    const startHour = parseInt(session.startTime.split(':')[0]);
                    const hourKey = `${startHour}:00`;
                    if (!hourlyProductivity[hourKey]) {
                        hourlyProductivity[hourKey] = { hours: 0, revenue: 0, sessions: 0 };
                    }
                    hourlyProductivity[hourKey].hours += session.duration || 0;
                    hourlyProductivity[hourKey].revenue += session.earnings || 0;
                    hourlyProductivity[hourKey].sessions += 1;
                });

                // Dati per fascia oraria
                const timeSlotData = {};
                allSessions.forEach(session => {
                    const startHour = parseInt(session.startTime.split(':')[0]);
                    let timeSlot;
                    if (startHour >= 6 && startHour < 12) timeSlot = 'Mattina (6-12)';
                    else if (startHour >= 12 && startHour < 18) timeSlot = 'Pomeriggio (12-18)';
                    else if (startHour >= 18 && startHour < 24) timeSlot = 'Sera (18-24)';
                    else timeSlot = 'Notte (0-6)';

                    if (!timeSlotData[timeSlot]) {
                        timeSlotData[timeSlot] = { hours: 0, revenue: 0, sessions: 0 };
                    }
                    timeSlotData[timeSlot].hours += session.duration || 0;
                    timeSlotData[timeSlot].revenue += session.earnings || 0;
                    timeSlotData[timeSlot].sessions += 1;
                });

                // Top 10 sessioni più redditizie
                const topSessions = allSessions
                    .sort((a, b) => (b.earnings || 0) - (a.earnings || 0))
                    .slice(0, 10);

                // Dati per confronto mensile
                const currentMonth = new Date().getMonth();
                const currentYear = new Date().getFullYear();
                const previousMonth = currentMonth === 0 ? 11 : currentMonth - 1;
                const previousYear = currentMonth === 0 ? currentYear - 1 : currentYear;

                const currentMonthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
                const previousMonthKey = `${previousYear}-${String(previousMonth + 1).padStart(2, '0')}`;

                const currentMonthData = monthlyData[currentMonthKey] || { hours: 0, revenue: 0 };
                const previousMonthData = monthlyData[previousMonthKey] || { hours: 0, revenue: 0 };

                // Dati per diversificazione clienti
                const clientDependency = Object.entries(clientData)
                    .sort(([, a], [, b]) => b.totalRevenue - a.totalRevenue)
                    .map(([client, data], index) => ({
                        client,
                        revenue: data.totalRevenue,
                        percentage: (data.totalRevenue / totalRevenue) * 100,
                        rank: index + 1
                    }));

                return {
                    totalHours,
                    totalRevenue,
                    uniqueClients,
                    clientData,
                    monthlyData,
                    weeklyData,
                    weekData,
                    allSessions,
                    hourlyProductivity,
                    timeSlotData,
                    topSessions,
                    currentMonthData,
                    previousMonthData,
                    clientDependency
                };
            }

                const monthsTabBar = document.createElement('div');

                // Sezione mesi (centrata)

                    render();

                monthsTabBar.querySelector('#nextYear').onclick = () => {

                const calendar = document.createElement('div');

                let weekHeader = '<div class="grid grid-cols-7 bg-gray-50 border-b">';

                // Days grid

                let daysGrid = '<div class="grid grid-cols-7">';
                days.forEach((day, idx) => {

                    daysGrid += `

            data-datekey="${dateKey}"
            ${day.isCurrentMonth ? `ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${dateKey}')"` : 'style="pointer-events:none;opacity:0.5;"'}>

                root.appendChild(header);

                container.innerHTML = `

            function getContrastColor(hexColor) {
                if (!hexColor) return '#000000';
                // Calcola il valore di luminosità in base al colore RGB
                const r = parseInt(hexColor.slice(1, 3), 16);
                const g = parseInt(hexColor.slice(3, 5), 16);
                const b = parseInt(hexColor.slice(5, 7), 16);
                const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                // Se la luminosità è bassa (scuro), restituisce bianco, altrimenti nero
                return luminance > 0.5 ? '#000000' : '#FFFFFF';
            }

                modalRoot.style.display = 'block';

            function handleSessionSubmit(event) {
                const form = event.target;
                const clientName = form.clientName.value.trim();
                const startTime = form.startTime.value;
                const endTime = form.endTime.value;
                const hourlyRate = parseFloat(form.hourlyRate.value) || 0;
                const inpsRate = parseFloat(form.inpsRate.value) || 0;
                const notes = form.notes.value.trim();
                const clientColor = form.clientColor.value;

                if (!clientName || !startTime || !endTime) {
                    alert('Compila tutti i campi obbligatori.');
                    return;
                }

                const start = new Date(`${selectedDateKey}T${startTime}`);
                const end = new Date(`${selectedDateKey}T${endTime}`);
                const duration = (end.getTime() - start.getTime()) / (1000 * 60 * 60);
                
                // Calcola il ricavo totale basato sulla tariffa oraria
                const earnings = hourlyRate * duration;

                const newSession = {
                    clientName,
                    startTime,
                    endTime,
                    duration,
                    earnings,
                    clientColor,
                    hourlyRate,
                    inpsRate,
                    notes
                };

                if (!workSessions[selectedDateKey]) {
                    workSessions[selectedDateKey] = [];
                }

                if (editingSessionIndex !== null) {
                    // Modifica sessione esistente
                    workSessions[selectedDateKey][editingSessionIndex] = newSession;
                } else {
                    // Aggiungi nuova sessione
                    workSessions[selectedDateKey].push(newSession);
                }

                saveToStorage();
                closeModal();
                render();
            }

            function deleteSession(index) {
                if (confirm('Sei sicuro di voler eliminare questa sessione?')) {
                    workSessions[selectedDateKey].splice(index, 1);
                    if (workSessions[selectedDateKey].length === 0) {
                        delete workSessions[selectedDateKey];
                    }
                    saveToStorage();
                    openSessionModal(selectedDateKey);
                }
            }

                const bgColor = session.clientColor || '#3B82F6';
                const textColor = getContrastColor(bgColor);

                <div class="text-sm">${session.startTime} - ${session.endTime} (${session.duration.toFixed(1)}h)</div>

                </button>
                <button onclick="deleteSession(${index})" class="p-2 rounded-full bg-white bg-opacity-20 hover:bg-opacity-30 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.035 21H7.965a2 2 0 01-1.997-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            </div>
        </div>
    `;

            // --- Drag & Drop ---
            let draggedSession = null;
            let draggedSessionDateKey = null;

            function handleDragStart(event, sessionIndex, dateKey) {
                draggedSession = workSessions[dateKey][sessionIndex];
                draggedSessionDateKey = dateKey;
                event.dataTransfer.effectAllowed = 'move';
            }

            function handleDragOver(event) {
                event.preventDefault();
                event.target.closest('div[data-datekey]').classList.add('bg-blue-200');
            }

            function handleDragLeave(event) {
                event.preventDefault();
                event.target.closest('div[data-datekey]').classList.remove('bg-blue-200');
            }

            function handleDrop(event, newDateKey) {
                event.preventDefault();
                event.target.closest('div[data-datekey]').classList.remove('bg-blue-200');

                if (draggedSession && draggedSessionDateKey && draggedSessionDateKey !== newDateKey) {
                    // Rimuovi la sessione dalla data originale
                    const oldSessions = workSessions[draggedSessionDateKey];
                    const oldSessionIndex = oldSessions.findIndex(s => s === draggedSession);
                    if (oldSessionIndex > -1) {
                        oldSessions.splice(oldSessionIndex, 1);
                        if (oldSessions.length === 0) {
                            delete workSessions[draggedSessionDateKey];
                        }
                    }

                    // Aggiungi la sessione alla nuova data
                    if (!workSessions[newDateKey]) {
                        workSessions[newDateKey] = [];
                    }
                    workSessions[newDateKey].push(draggedSession);

                    draggedSession.date = newDateKey;

                    saveToStorage();
                    render();
                }
            }

            function handleDragEnd(event) {
                draggedSession = null;
                draggedSessionDateKey = null;
                document.querySelectorAll('[data-datekey]').forEach(cell => cell.classList.remove('bg-blue-200'));
            }

            function editSession(dateKey, sessionIndex) {
                event.stopPropagation();
                selectedDateKey = dateKey;
                const session = workSessions[dateKey][sessionIndex];
                openAddSessionForm(session, sessionIndex);
            }

            function deleteSessionFromCalendar(dateKey, sessionIndex) {
                event.stopPropagation();
                if (confirm('Sei sicuro di voler eliminare questa sessione?')) {
                    workSessions[dateKey].splice(sessionIndex, 1);
                    if (workSessions[dateKey].length === 0) {
                        delete workSessions[dateKey];
                    }
                    saveToStorage();
                    render();
                }
            }
