<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendario Gestione Clienti</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>
        <style>
            /* === MODERN DESIGN SYSTEM === */
            :root {
                --primary-50: #eff6ff;
                --primary-100: #dbeafe;
                --primary-200: #bfdbfe;
                --primary-300: #93c5fd;
                --primary-400: #60a5fa;
                --primary-500: #3b82f6;
                --primary-600: #2563eb;
                --primary-700: #1d4ed8;
                --primary-800: #1e40af;
                --primary-900: #1e3a8a;
                
                --success-50: #f0fdf4;
                --success-100: #dcfce7;
                --success-200: #bbf7d0;
                --success-300: #86efac;
                --success-400: #4ade80;
                --success-500: #22c55e;
                --success-600: #16a34a;
                --success-700: #15803d;
                --success-800: #166534;
                --success-900: #14532d;
                
                --warning-50: #fffbeb;
                --warning-100: #fef3c7;
                --warning-200: #fde68a;
                --warning-300: #fcd34d;
                --warning-400: #fbbf24;
                --warning-500: #f59e0b;
                --warning-600: #d97706;
                --warning-700: #b45309;
                --warning-800: #92400e;
                --warning-900: #78350f;
                
                --danger-50: #fef2f2;
                --danger-100: #fee2e2;
                --danger-200: #fecaca;
                --danger-300: #fca5a5;
                --danger-400: #f87171;
                --danger-500: #ef4444;
                --danger-600: #dc2626;
                --danger-700: #b91c1c;
                --danger-800: #991b1b;
                --danger-900: #7f1d1d;
                
                --gray-50: #f9fafb;
                --gray-100: #f3f4f6;
                --gray-200: #e5e7eb;
                --gray-300: #d1d5db;
                --gray-400: #9ca3af;
                --gray-500: #6b7280;
                --gray-600: #4b5563;
                --gray-700: #374151;
                --gray-800: #1f2937;
                --gray-900: #111827;
                
                --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
                --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
                --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
                --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
                --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
                --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
                
                --radius-sm: 0.25rem;
                --radius: 0.375rem;
                --radius-md: 0.5rem;
                --radius-lg: 0.75rem;
                --radius-xl: 1rem;
                --radius-2xl: 1.5rem;
                --radius-3xl: 2rem;
                
                --transition-fast: 150ms ease-in-out;
                --transition-normal: 250ms ease-in-out;
                --transition-slow: 350ms ease-in-out;
            }

            /* === DARK MODE SUPPORT === */
            @media (prefers-color-scheme: dark) {
                :root {
                    --gray-50: #111827;
                    --gray-100: #1f2937;
                    --gray-200: #374151;
                    --gray-300: #4b5563;
                    --gray-400: #6b7280;
                    --gray-500: #9ca3af;
                    --gray-600: #d1d5db;
                    --gray-700: #e5e7eb;
                    --gray-800: #f3f4f6;
                    --gray-900: #f9fafb;
                }
            }

            /* === ENHANCED TYPOGRAPHY === */
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                line-height: 1.6;
                color: var(--gray-900);
                background-color: var(--gray-50);
            }

            /* === IMPROVED ACCESSIBILITY === */
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            /* === FOCUS STATES === */
            button:focus-visible,
            input:focus-visible,
            textarea:focus-visible,
            select:focus-visible {
                outline: 2px solid var(--primary-500);
                outline-offset: 2px;
            }

            /* === ENHANCED MODAL === */
            .modal-bg {
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(4px);
            }

            .modal-content {
                animation: modalSlideIn 0.3s ease-out;
            }

            @keyframes modalSlideIn {
                from {
                    opacity: 0;
                    transform: translateY(-20px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            /* === IMPROVED MOBILE EXPERIENCE === */
            @media (max-width: 768px) {
                #modal-root:not([style*="display: none"]) {
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    padding: 1rem;
                }

                #modal-root:not([style*="display: none"]) > div {
                    margin: auto !important;
                    transform: none !important;
                    max-width: calc(100vw - 2rem);
                    max-height: calc(100vh - 2rem);
                }
            }

            /* === ENHANCED TAB SYSTEM === */
            .tab-active {
                border-bottom: 3px solid var(--primary-500);
                color: var(--primary-600);
                background: var(--primary-50);
                font-weight: 600;
            }

            .tab-inactive {
                color: var(--gray-500);
                transition: all var(--transition-normal);
            }

            .tab-inactive:hover {
                color: var(--primary-600);
                background: var(--primary-50);
            }

            /* === ENHANCED CALENDAR DAYS === */
            [data-datekey] {
                border-radius: var(--radius-lg);
                transition: all var(--transition-normal);
                position: relative;
                overflow: hidden;
            }

            [data-datekey]:hover {
                background-color: var(--primary-50) !important;
                transform: translateY(-2px);
                box-shadow: var(--shadow-lg);
            }

            [data-datekey]:active {
                transform: translateY(0);
            }

            [data-datekey]::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(90deg, var(--primary-400), var(--primary-600));
                opacity: 0;
                transition: opacity var(--transition-normal);
            }

            [data-datekey]:hover::before {
                opacity: 1;
            }

            [data-datekey] > div:first-child > span {
                font-size: 1rem;
                font-weight: 700;
                color: var(--gray-700);
            }

            /* === ENHANCED SESSION CARDS === */
            .session-card {
                box-shadow: var(--shadow-sm);
                border-radius: var(--radius-md);
                font-size: 0.75rem;
                font-weight: 500;
                transition: all var(--transition-normal);
                position: relative;
                overflow: hidden;
                min-height: 70px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .session-card:hover {
                transform: translateY(-1px);
                box-shadow: var(--shadow-md);
                z-index: 10;
            }

            .session-card .session-actions {
                opacity: 0;
                transition: opacity var(--transition-normal);
                position: absolute;
                top: 2px;
                right: 2px;
                background: rgba(0,0,0,0.1);
                border-radius: 3px;
                padding: 1px;
            }

            .session-card:hover .session-actions {
                opacity: 1;
            }

            /* === FULL-WIDTH CALENDAR SESSION DESIGN === */
            .calendar-day .session-card {
                margin-bottom: 0px;
                padding: 6px;
                font-size: 11px;
                line-height: 1.3;
                width: calc(100% + 0.5rem);
                margin-left: -0.25rem;
                margin-right: -0.25rem;
                box-sizing: border-box;
                border-radius: 1rem;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 60px;
                background: white;
            }

            .calendar-day .session-card .session-content {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 6px;
            }

            .calendar-day .session-card .client-name {
                font-weight: 700;
                font-size: 13px;
                margin-bottom: 0px;
                width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: inherit;
            }

            .calendar-day .session-card .activity {
                font-size: 13px;
                font-weight: 700;
                margin-bottom: 0px;
                opacity: 1;
                color: #3B6BAA; /* blu NCS S 2060-R90B approx */
                margin-left: 12px;
            }

            .calendar-day .session-card .time {
                font-weight: 700;
                font-size: 10px;
                opacity: 0.8;
                margin-top: 0px;
            }

            /* === FULL-WIDTH CALENDAR DAY DESIGN === */
            .calendar-day {
                background: white;
                min-height: 120px;
                padding: 0.25rem;
                transition: background-color var(--transition-normal);
                position: relative;
                border: 1px solid var(--gray-100);
            }

            .calendar-day:hover {
                background: var(--gray-50);
            }

            .calendar-day.today {
                background: var(--primary-50);
                border-color: var(--primary-200);
            }

            .calendar-day.other-month {
                background: var(--gray-50);
                color: var(--gray-400);
            }

            .calendar-day .day-header {
                margin-bottom: 1px;
            }

            .calendar-day .day-number {
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--gray-700);
            }



            /* === FULL-WIDTH SESSION CONTAINER === */
            .calendar-day .sessions-container {
                overflow-y: auto;
                scrollbar-width: none;
                width: 100%;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .calendar-day .sessions-container::-webkit-scrollbar {
                display: none;
            }

            /* === MINIMAL SESSION HOVER === */
            .calendar-day .session-card {
                position: relative;
                z-index: 1;
            }

            .calendar-day .session-card:hover {
                z-index: 10;
                opacity: 0.9;
            }

            .calendar-day .overflow-indicator {
                background: var(--gray-100);
                border-radius: 3px;
                margin-top: 1px;
                opacity: 0.7;
            }

            /* === ENHANCED FORM ELEMENTS === */
            .form-input {
                border-radius: var(--radius-lg);
                padding: 0.875rem 1rem;
                font-size: 0.875rem;
                transition: all var(--transition-normal);
                border: 2px solid var(--gray-200);
                background: white;
            }

            .form-input:focus {
                border-color: var(--primary-500);
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
                outline: none;
            }

            .form-input:invalid {
                border-color: var(--danger-400);
            }

            /* === ENHANCED BUTTONS === */
            .btn {
                transition: all var(--transition-normal);
                font-weight: 600;
                border-radius: var(--radius-lg);
                position: relative;
                overflow: hidden;
            }

            .btn:hover {
                transform: translateY(-1px);
                box-shadow: var(--shadow-md);
            }

            .btn:active {
                transform: translateY(0);
            }

            .btn-primary {
                background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
                color: white;
                border: none;
            }

            .btn-primary:hover {
                background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            }

            .btn-secondary {
                background: white;
                color: var(--gray-700);
                border: 2px solid var(--gray-200);
            }

            .btn-secondary:hover {
                border-color: var(--primary-400);
                color: var(--primary-600);
            }

            .btn-danger {
                background: linear-gradient(135deg, var(--danger-500), var(--danger-600));
                color: white;
                border: none;
            }

            .btn-danger:hover {
                background: linear-gradient(135deg, var(--danger-600), var(--danger-700));
            }

            /* === LOADING STATES === */
            .loading {
                position: relative;
                overflow: hidden;
            }

            .loading::after {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
                animation: loading 1.5s infinite;
            }

            @keyframes loading {
                0% { left: -100%; }
                100% { left: 100%; }
            }

            /* === ENHANCED CARDS === */
            .card {
                background: white;
                border-radius: var(--radius-xl);
                box-shadow: var(--shadow-lg);
                transition: all var(--transition-normal);
                border: 1px solid var(--gray-100);
            }

            .card:hover {
                box-shadow: var(--shadow-xl);
            }

            /* === ENHANCED STATS CARDS === */
            .stats-card {
                background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
                color: white;
                border-radius: var(--radius-xl);
                padding: 1.5rem;
                box-shadow: var(--shadow-xl);
                transition: all var(--transition-normal);
            }

            .stats-card:hover {
                transform: translateY(-4px);
                box-shadow: var(--shadow-2xl);
            }

            .stats-card.success {
                background: linear-gradient(135deg, var(--success-500), var(--success-600));
            }

            .stats-card.warning {
                background: linear-gradient(135deg, var(--warning-500), var(--warning-600));
            }

            /* === ENHANCED ANIMATIONS === */
            .fade-in {
                animation: fadeIn 0.5s ease-out;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .slide-in {
                animation: slideIn 0.3s ease-out;
            }

            @keyframes slideIn {
                from { transform: translateX(-20px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }

            /* === ENHANCED TOOLTIPS === */
            .tooltip {
                position: relative;
            }

            .tooltip::after {
                content: attr(data-tooltip);
                position: absolute;
                bottom: 100%;
                left: 50%;
                transform: translateX(-50%);
                background: var(--gray-800);
                color: white;
                padding: 0.5rem 0.75rem;
                border-radius: var(--radius);
                font-size: 0.75rem;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transition: opacity var(--transition-normal);
                z-index: 1000;
            }

            .tooltip:hover::after {
                opacity: 1;
            }

            /* === ENHANCED SCROLLBARS === */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: var(--gray-100);
                border-radius: var(--radius);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--gray-300);
                border-radius: var(--radius);
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--gray-400);
            }

            /* === RESPONSIVE IMPROVEMENTS === */
            @media (max-width: 640px) {
                .mobile-stack {
                    flex-direction: column;
                }
                
                .mobile-full {
                    width: 100%;
                }
                
                .mobile-text-center {
                    text-align: center;
                }
            }

            /* === ENHANCED NOTIFICATIONS === */
            .notification {
                position: fixed;
                top: 1rem;
                right: 1rem;
                padding: 1rem 1.5rem;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-xl);
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
            }

            .notification.success {
                background: var(--success-500);
                color: white;
            }

            .notification.error {
                background: var(--danger-500);
                color: white;
            }

            .notification.warning {
                background: var(--warning-500);
                color: white;
            }

            @keyframes slideInRight {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }

            /* === ENHANCED CALENDAR GRID === */
            .calendar-grid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 1px;
                background: var(--gray-200);
                border-radius: var(--radius-xl);
                overflow: hidden;
            }

            .calendar-day {
                background: white;
                min-height: 120px;
                padding: 0.75rem;
                transition: all var(--transition-normal);
            }

            .calendar-day:hover {
                background: var(--primary-50);
            }

            .calendar-day.today {
                background: var(--primary-100);
                border: 2px solid var(--primary-300);
            }

            .calendar-day.other-month {
                background: var(--gray-50);
                color: var(--gray-400);
            }

            /* === ENHANCED CHART CONTAINERS === */
            .chart-container {
                background: white;
                border-radius: var(--radius-xl);
                padding: 1.5rem;
                box-shadow: var(--shadow-lg);
                transition: all var(--transition-normal);
            }

            .chart-container:hover {
                box-shadow: var(--shadow-xl);
            }

            .calendar-day .session-card .activity.activity-dark {
                color: #1A2633; /* NCS S 8500-N approx, scuro per sfondo chiaro */
            }
            .calendar-day .session-card .activity.activity-light {
                color: #F5F7FA; /* NCS S 0500-N approx, chiaro per sfondo scuro */
            }
        </style>
    </head>

    <body class="bg-gray-50 min-h-screen">
        <div id="root" class="max-w-7xl mx-auto p-2 md:p-4"></div>
        <div id="modal-root" style="display:none;"></div>
        <div id="notifications-container"></div>
        <script>


            // === ENHANCED GLOBAL VARIABLES ===
            const months = [
                'Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
                'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'
            ];
            const weekDays = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];

            const barColors = [
                '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6',
                '#06B6D4', '#84CC16', '#F97316', '#EC4899', '#6366F1',
                '#A21CAF', '#F43F5E', '#FACC15', '#22D3EE', '#4ADE80', '#F472B6'
            ];

            let currentDate = new Date();
            let workSessions = {};
            let selectedDateKey = null;
            let editingSessionIndex = null;
            let currentView = 'calendar'; // 'calendar' o 'analytics'
            let analyticsTab = 0; // 0: Allocazione Tempo, 1: Frequenza, 2: Carico, 3: Redditività, 4: Produttività, 5: Diversificazione
            let isLoading = false;
            let notifications = [];

            // === ENHANCED UTILITY FUNCTIONS ===
            function showNotification(message, type = 'success', duration = 3000) {
                const notification = {
                    id: Date.now(),
                    message,
                    type,
                    duration
                };
                
                notifications.push(notification);
                renderNotifications();
                
                setTimeout(() => {
                    removeNotification(notification.id);
                }, duration);
            }

            function removeNotification(id) {
                notifications = notifications.filter(n => n.id !== id);
                renderNotifications();
            }

            function renderNotifications() {
                const container = document.getElementById('notifications-container');
                if (!container) return;
                
                container.innerHTML = notifications.map(notification => `
                    <div class="notification ${notification.type} fade-in" data-id="${notification.id}">
                        <div class="flex items-center space-x-2">
                            <span>${getNotificationIcon(notification.type)}</span>
                            <span>${notification.message}</span>
                            <button onclick="removeNotification(${notification.id})" class="ml-2 hover:opacity-75">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            function getNotificationIcon(type) {
                switch (type) {
                    case 'success': return '✅';
                    case 'error': return '❌';
                    case 'warning': return '⚠️';
                    default: return 'ℹ️';
                }
            }

            function setLoading(loading) {
                isLoading = loading;
                const root = document.getElementById('root');
                if (loading) {
                    root.classList.add('loading');
                } else {
                    root.classList.remove('loading');
                }
            }

            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            function throttle(func, limit) {
                let inThrottle;
                return function() {
                    const args = arguments;
                    const context = this;
                    if (!inThrottle) {
                        func.apply(context, args);
                        inThrottle = true;
                        setTimeout(() => inThrottle = false, limit);
                    }
                }
            }

            // Registra il plugin per i datalabels
            Chart.register(ChartDataLabels);


            // --- Inizializzazione Firebase Firestore ---
            const firebaseConfig = {
                apiKey: "AIzaSyAFyUXnpaT7eICBVnn80y_oufSxq5x7yWY",
                authDomain: "gestioneclienti-11d38.firebaseapp.com",
                projectId: "gestioneclienti-11d38",
                appId: "1:1021211846118:web:f92e44ad8d593a55b06227",
                measurementId: "G-7VJ9FRDDEN"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            const analytics = firebase.analytics();
            let isOnline = false;
            let userId = "cqX7v7RtgeZfvYDHe0QsGh496x52";


            // === ENHANCED HYBRID STORAGE (Firestore + localStorage) ===
            async function saveToStorage() {
                setLoading(true);
                try {
                    console.log('Salvataggio dati...', Object.keys(workSessions).length, 'giorni');
                    
                    // Salva sempre in localStorage come cache
                    localStorage.setItem('workSessions', JSON.stringify(workSessions));
                    console.log('Dati salvati in localStorage');

                    // Se online, sincronizza con Firestore
                    if (isOnline && userId) {
                        try {
                            await db.collection("work_sessions").doc(userId).set({
                                sessions: workSessions,
                                last_updated: new Date()
                            });

            // --- Utility ---
            function formatDateKey(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
            function isToday(date) {
                const today = new Date();
                return date.getDate() === today.getDate() &&
                    date.getMonth() === today.getMonth() &&
                    date.getFullYear() === today.getFullYear();
            }
            function getDaysInMonth(date) {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startDayOfWeek = (firstDay.getDay() + 6) % 7;
                const days = [];
                // Giorni del mese precedente
                for (let i = startDayOfWeek - 1; i >= 0; i--) {
                    const prevDate = new Date(year, month, -i);
                    days.push({ date: prevDate, isCurrentMonth: false });
                }
                // Giorni del mese corrente
                for (let day = 1; day <= daysInMonth; day++) {
                    const currentDay = new Date(year, month, day);
                    days.push({ date: currentDay, isCurrentMonth: true });
                }
                // Giorni del mese successivo
                const remainingDays = 42 - days.length;
                for (let day = 1; day <= remainingDays; day++) {
                    const nextDate = new Date(year, month + 1, day);
                    days.push({ date: nextDate, isCurrentMonth: false });
                }
                return days;
            }
            function getWeekNumber(date) {
                const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const dayNum = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            }

            // --- Analisi dati ---
            function getAnalyticsData() {
                const allSessions = [];
                Object.entries(workSessions).forEach(([dateKey, sessions]) => {
                    sessions.forEach(session => {
                        allSessions.push({
                            ...session,
                            date: dateKey,
                            dateObj: new Date(dateKey)
                        });
                    });
                });
                // Statistiche generali
                const totalHours = allSessions.reduce((sum, session) => sum + (session.duration || 0), 0);
                const totalRevenue = allSessions.reduce((sum, session) => sum + (session.earnings || 0), 0);
                const uniqueClients = [...new Set(allSessions.map(session => session.clientName))];
                // Dati per cliente
                const clientData = {};
                allSessions.forEach(session => {
                    if (!clientData[session.clientName]) {
                        clientData[session.clientName] = {
                            totalHours: 0,
                            totalRevenue: 0,
                            interventions: 0,
                            color: session.clientColor || '#3B82F6'
                        };
                    }
                    clientData[session.clientName].totalHours += session.duration || 0;
                    clientData[session.clientName].totalRevenue += session.earnings || 0;
                    clientData[session.clientName].interventions += 1;
                });
                // Dati mensili
                const monthlyData = {};
                allSessions.forEach(session => {
                    const monthKey = `${session.dateObj.getFullYear()}-${String(session.dateObj.getMonth() + 1).padStart(2, '0')}`;
                    if (!monthlyData[monthKey]) {
                        monthlyData[monthKey] = { hours: 0, revenue: 0 };
                    }
                    monthlyData[monthKey].hours += session.duration || 0;
                    monthlyData[monthKey].revenue += session.earnings || 0;
                });
                // Dati settimanali
                const weeklyData = {};
                allSessions.forEach(session => {
                    const weekDay = session.dateObj.getDay();
                    const weekDayName = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'][weekDay];
                    if (!weeklyData[weekDayName]) {
                        weeklyData[weekDayName] = { hours: 0, count: 0 };
                    }
                    weeklyData[weekDayName].hours += session.duration || 0;
                    weeklyData[weekDayName].count += 1;
                });
                // Ore per settimana
                const weekData = {};
                allSessions.forEach(session => {
                    const week = getWeekNumber(session.dateObj);
                    const year = session.dateObj.getFullYear();
                    const key = `${year}-W${String(week).padStart(2, '0')}`;
                    if (!weekData[key]) weekData[key] = 0;
                    weekData[key] += session.duration || 0;
                });

                // Dati per produttività temporale
                const hourlyProductivity = {};
                allSessions.forEach(session => {
                    const startHour = parseInt(session.startTime.split(':')[0]);
                    const hourKey = `${startHour}:00`;
                    if (!hourlyProductivity[hourKey]) {
                        hourlyProductivity[hourKey] = { hours: 0, revenue: 0, sessions: 0 };
                    }
                    hourlyProductivity[hourKey].hours += session.duration || 0;
                    hourlyProductivity[hourKey].revenue += session.earnings || 0;
                    hourlyProductivity[hourKey].sessions += 1;
                });

                // Dati per fascia oraria
                const timeSlotData = {};
                allSessions.forEach(session => {
                    const startHour = parseInt(session.startTime.split(':')[0]);
                    let timeSlot;
                    if (startHour >= 6 && startHour < 12) timeSlot = 'Mattina (6-12)';
                    else if (startHour >= 12 && startHour < 18) timeSlot = 'Pomeriggio (12-18)';
                    else if (startHour >= 18 && startHour < 24) timeSlot = 'Sera (18-24)';
                    else timeSlot = 'Notte (0-6)';

                    if (!timeSlotData[timeSlot]) {
                        timeSlotData[timeSlot] = { hours: 0, revenue: 0, sessions: 0 };
                    }
                    timeSlotData[timeSlot].hours += session.duration || 0;
                    timeSlotData[timeSlot].revenue += session.earnings || 0;
                    timeSlotData[timeSlot].sessions += 1;
                });

                // Top 10 sessioni più redditizie
                const topSessions = allSessions
                    .sort((a, b) => (b.earnings || 0) - (a.earnings || 0))
                    .slice(0, 10);

                // Dati per confronto mensile
                const currentMonth = new Date().getMonth();
                const currentYear = new Date().getFullYear();
                const previousMonth = currentMonth === 0 ? 11 : currentMonth - 1;
                const previousYear = currentMonth === 0 ? currentYear - 1 : currentYear;

                const currentMonthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
                const previousMonthKey = `${previousYear}-${String(previousMonth + 1).padStart(2, '0')}`;

                const currentMonthData = monthlyData[currentMonthKey] || { hours: 0, revenue: 0 };
                const previousMonthData = monthlyData[previousMonthKey] || { hours: 0, revenue: 0 };

                // Dati per diversificazione clienti
                const clientDependency = Object.entries(clientData)
                    .sort(([, a], [, b]) => b.totalRevenue - a.totalRevenue)
                    .map(([client, data], index) => ({
                        client,
                        revenue: data.totalRevenue,
                        percentage: (data.totalRevenue / totalRevenue) * 100,
                        rank: index + 1
                    }));

                return {
                    totalHours,
                    totalRevenue,
                    uniqueClients,
                    clientData,
                    monthlyData,
                    weeklyData,
                    weekData,
                    allSessions,
                    hourlyProductivity,
                    timeSlotData,
                    topSessions,
                    currentMonthData,
                    previousMonthData,
                    clientDependency
                };
            }

            function getContrastColor(hexColor) {
                if (!hexColor) return '#000000';
                // Calcola il valore di luminosità in base al colore RGB
                const r = parseInt(hexColor.slice(1, 3), 16);
                const g = parseInt(hexColor.slice(3, 5), 16);
                const b = parseInt(hexColor.slice(5, 7), 16);
                const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                // Se la luminosità è bassa (scuro), restituisce bianco, altrimenti nero
                return luminance > 0.5 ? '#000000' : '#FFFFFF';
            }

            async function handleSessionSubmit(event) {
                try {
                    setLoading(true);
                    
                    const clientName = document.getElementById('clientName').value.trim();
                    const clientColor = document.getElementById('clientColor').value || '#FFFFFF';
                    const startTime = document.getElementById('startTime').value;
                    const endTime = document.getElementById('endTime').value;
                    const hourlyRate = parseFloat(document.getElementById('hourlyRate').value || 0);
                    const inpsRate = parseFloat(document.getElementById('inpsRate').value || 0);
                    const notes = document.getElementById('notes').value.trim();

                    // Enhanced validation with better user feedback
                    const errors = [];
                    
                    if (!clientName) {
                        errors.push('Nome cliente è obbligatorio');
                    }
                    
                    if (!notes) {
                        errors.push('Descrizione attività è obbligatoria');
                    }
                    
                    if (!startTime) {
                        errors.push('Orario di inizio è obbligatorio');
                    }
                    
                    if (!endTime) {
                        errors.push('Orario di fine è obbligatorio');
                    }
                    
                    if (startTime && endTime) {
                        const start = new Date(`1970-01-01T${startTime}:00`);
                        const end = new Date(`1970-01-01T${endTime}:00`);
                        if (end <= start) {
                            errors.push('L\'orario di fine deve essere successivo a quello di inizio');
                        }
                    }
                    
                    if (hourlyRate < 0) {
                        errors.push('La tariffa oraria non può essere negativa');
                    }
                    
                    if (inpsRate < 0 || inpsRate > 100) {
                        errors.push('L\'aliquota INPS deve essere tra 0 e 100%');
                    }

                    if (errors.length > 0) {
                        showNotification(errors.join('\n'), 'error', 5000);
                        return;
                    }

                    const start = new Date(`1970-01-01T${startTime}:00`);
                    const end = new Date(`1970-01-01T${endTime}:00`);
                    const duration = (end - start) / (1000 * 60 * 60);
                    const earnings = hourlyRate * duration;

                    const sessionData = {
                        clientName,
                        clientColor,
                        startTime,
                        endTime,
                        duration,
                        earnings,
                        hourlyRate,
                        inpsRate,
                        attivita: notes
                    };

                    // Se stiamo modificando una sessione, salva la vecchia attività e il vecchio nome cliente
                    let oldActivity = null;
                    let oldClientName = null;
                    if (editingSessionIndex !== null) {
                        const oldSession = workSessions[selectedDateKey][editingSessionIndex];
                        oldActivity = oldSession.attivita;
                        oldClientName = oldSession.clientName;
                    }

                    if (!workSessions[selectedDateKey]) {
                        workSessions[selectedDateKey] = [];
                    }

                    if (editingSessionIndex !== null) {
                        workSessions[selectedDateKey][editingSessionIndex] = sessionData;
                    } else {
                        workSessions[selectedDateKey].push(sessionData);
                    }

                    // 🔄 AGGIORNA GLOBALMENTE TUTTE LE SESSIONI DELLA STESSA ATTIVITÀ
                    if (oldActivity && oldActivity !== notes) {
                        // Se l'attività è cambiata, aggiorna tutte le sessioni con la vecchia attività
                        Object.entries(workSessions).forEach(([dateKey, sessions]) => {
                            sessions.forEach(session => {
                                if (session.attivita && session.attivita.toLowerCase() === oldActivity.toLowerCase()) {
                                    session.clientColor = clientColor;
                                    session.hourlyRate = hourlyRate;
                                    session.inpsRate = inpsRate;
                                    if (session.duration) {
                                        session.earnings = hourlyRate * session.duration;
                                    }
                                }
                            });
                        });
                    } else {
                        // Se è una nuova sessione o l'attività non è cambiata, aggiorna solo le sessioni esistenti della stessa attività
                        Object.entries(workSessions).forEach(([dateKey, sessions]) => {
                            sessions.forEach(session => {
                                if (session.attivita && session.attivita.toLowerCase() === notes.toLowerCase()) {
                                    session.clientColor = clientColor;
                                    session.hourlyRate = hourlyRate;
                                    session.inpsRate = inpsRate;
                                    if (session.duration) {
                                        session.earnings = hourlyRate * session.duration;
                                    }
                                }
                            });
                        });
                    }

                    // 🔄 AGGIORNA GLOBALMENTE TUTTE LE SESSIONI DEL CLIENTE
                    if (oldClientName && oldClientName !== clientName) {
                        // Se il nome del cliente è cambiato, aggiorna tutte le sessioni con il vecchio nome
                        Object.entries(workSessions).forEach(([dateKey, sessions]) => {
                            sessions.forEach(session => {
                                if (session.clientName === oldClientName) {
                                    session.clientName = clientName;
                                }
                            });
                        });
                    }

                    await saveToStorage();
                    closeModal();
                    
                } catch (error) {
                    console.error('Errore nel salvataggio della sessione:', error);
                    showNotification('Errore nel salvataggio della sessione', 'error', 5000);
                } finally {
                    setLoading(false);
                }
            }

            // --- Drag & Drop ---
            let draggedSession = null;
            let draggedSessionDateKey = null;

            function handleDragStart(event, sessionIndex, dateKey) {
                draggedSession = workSessions[dateKey][sessionIndex];
                draggedSessionDateKey = dateKey;
                event.dataTransfer.effectAllowed = 'move';
            }

            function handleDragOver(event) {
                event.preventDefault();
                event.target.closest('div[data-datekey]').classList.add('bg-blue-200');
            }

            function handleDragLeave(event) {
                event.preventDefault();
                event.target.closest('div[data-datekey]').classList.remove('bg-blue-200');
            }

            function handleDrop(event, newDateKey) {
                event.preventDefault();
                event.target.closest('div[data-datekey]').classList.remove('bg-blue-200');

                if (draggedSession && draggedSessionDateKey && draggedSessionDateKey !== newDateKey) {
                    // Rimuovi la sessione dalla data originale
                    const oldSessions = workSessions[draggedSessionDateKey];
                    const oldSessionIndex = oldSessions.findIndex(s => s === draggedSession);
                    if (oldSessionIndex > -1) {
                        oldSessions.splice(oldSessionIndex, 1);
                        if (oldSessions.length === 0) {
                            delete workSessions[draggedSessionDateKey];
                        }
                    }

                    // Aggiungi la sessione alla nuova data
                    if (!workSessions[newDateKey]) {
                        workSessions[newDateKey] = [];
                    }
                    workSessions[newDateKey].push(draggedSession);

                    draggedSession.date = newDateKey;

                    saveToStorage();
                    render();
                }
            }

            function handleDragEnd(event) {
                draggedSession = null;
                draggedSessionDateKey = null;
                document.querySelectorAll('[data-datekey]').forEach(cell => cell.classList.remove('bg-blue-200'));
            }

            function editSession(dateKey, sessionIndex) {
                event.stopPropagation();
                selectedDateKey = dateKey;
                const session = workSessions[dateKey][sessionIndex];
                openAddSessionForm(session, sessionIndex);
            }

            function deleteSessionFromCalendar(dateKey, sessionIndex) {
                event.stopPropagation();
                if (confirm('Sei sicuro di voler eliminare questa sessione?')) {
                    workSessions[dateKey].splice(sessionIndex, 1);
                    if (workSessions[dateKey].length === 0) {
                        delete workSessions[dateKey];
                    }
                    saveToStorage();
                    render();
                }
            }

            function isDarkMode() {
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }

            // Funzione per convertire HEX in HSL
            function hexToHSL(hex) {
                hex = hex.replace('#', '');
                let r = parseInt(hex.substring(0,2), 16) / 255;
                let g = parseInt(hex.substring(2,4), 16) / 255;
                let b = parseInt(hex.substring(4,6), 16) / 255;
                let max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;
                if(max === min){ h = s = 0; }
                else {
                    let d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch(max){
                        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                        case g: h = (b - r) / d + 2; break;
                        case b: h = (r - g) / d + 4; break;
                    }
                    h /= 6;
                }
                return { h: h * 360, s: s * 100, l: l * 100 };
            }

            // Funzione per convertire HSL in HEX
            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                let c = (1 - Math.abs(2 * l - 1)) * s;
                let x = c * (1 - Math.abs((h / 60) % 2 - 1));
                let m = l - c/2;
                let r=0, g=0, b=0;
                if (0 <= h && h < 60) { r = c; g = x; b = 0; }
                else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
                else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
                else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
                else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
                else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
                r = Math.round((r + m) * 255);
                g = Math.round((g + m) * 255);
                b = Math.round((b + m) * 255);
                return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            // Funzione per calcolare un colore armonico e leggibile (stessa nuance, hue ruotato di 90°, luminosità adattata)
            function getNuanceColor(hex) {
                const hsl = hexToHSL(hex);
                // Blu → Giallo oro #FACC15
                if (hex.toLowerCase() === '#3b82f6' || hex.toLowerCase() === '#2563eb') {
                    return '#FACC15';
                }
                if (hsl.h >= 180 && hsl.h <= 260) {
                    return '#FACC15';
                }
                // Verde → Rosso violaceo
                if (hex.toLowerCase() === '#22c55e' || hex.toLowerCase() === '#16a34a') {
                    return hslToHex(330, 60, 50);
                }
                if (hsl.h >= 70 && hsl.h <= 170) {
                    return hslToHex(330, 60, 50);
                }
                // Default: ruota hue di 90°, saturazione 55%, luminosità 70/35
                let newHue = (hsl.h + 90) % 360;
                let newS = 55;
                return hsl.l < 50 ? hslToHex(newHue, newS, 70) : hslToHex(newHue, newS, 35);
            }

        </script>
